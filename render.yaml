services:
  - type: web
    name: creditguard
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: cd backend && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: creditguard_secure_jwt_token_2026
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: DATABASE_URL
        fromDatabase:
          name: creditguard-db
          property: connectionString

databases:
  - name: creditguard-db
    plan: free
    region: singapore
    databaseName: creditguard_db
    user: creditguard
